<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" role="img" aria-labelledby="title description">
  <title id="title">台車上の倒立振子</title>
  <desc id="description">台車位置pの正方向は右。振子角φは鉛直上向きから、先端が右へ傾く向きを正とする。入力Fは台車への水平力。</desc>
  <rect x="0" y="0" width="560" height="350" fill="white" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>
  <line x1="45" y1="295" x2="505" y2="295" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="150" y="235" width="160" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <circle cx="180" cy="285" r="10" fill="#334155" />
  <circle cx="280" cy="285" r="10" fill="#334155" />
  <line x1="230" y1="235" x2="230" y2="45" stroke="#334155" stroke-width="2" stroke-dasharray="6 5" />
  <path d="M 230 235 L 300 70" stroke="#2563eb" stroke-width="7" />
  <circle cx="300" cy="70" r="15" fill="#2563eb" />
  <circle cx="230" cy="235" r="6" fill="#0f172a" />
  <path d="M 230 180 A 55 55 0 0 1 251.5 184.4" fill="none" stroke="#c2410c" stroke-width="2" />
  <line x1="320" y1="257" x2="440" y2="257" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <text x="170" y="36" fill="#0f172a" font-family="sans-serif" font-size="18">鉛直上向き：φ = 0</text>
  <text x="270" y="187" fill="#0f172a" font-family="sans-serif" font-size="18">φ</text>
  <text x="288" y="151" fill="#0f172a" font-family="sans-serif" font-size="18">長さ l</text>
  <text x="324" y="76" fill="#0f172a" font-family="sans-serif" font-size="18">先端質量 m</text>
  <text x="190" y="264" fill="#0f172a" font-family="sans-serif" font-size="18">台車 M</text>
  <text x="350" y="245" fill="#0f172a" font-family="sans-serif" font-size="18">入力 F</text>
  <text x="128" y="330" fill="#0f172a" font-family="sans-serif" font-size="18">台車位置 p の正方向 →</text>
</svg>